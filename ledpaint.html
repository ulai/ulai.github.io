<script type="text/babel" data-type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { useState } from 'react';

const m = Array(64).fill().map(()=>Array(64).fill())

let App = function LedMatrix() {
	const [matrix, updateMatrix] = useState(m)
	const grid = []
	for(let y=0; y<64; y++) {
		const cols = []
		for(let x=0; x<64; x++) {
			cols.push(<span key={`x:${x},y:${y}`} onClick={e => e.target.style.backgroundColor = 'red'} onMouseOver={e => {
				if(e.buttons > 0) e.target.style.backgroundColor = e.buttons == 1 ? 'red' : 'white'
			}}>{m[x][y]}</span>)
		}
		grid.push(<div className="row">{cols}</div>)
	}
	
	return ( <div> <button onClick={e => m[1][1] = 1}>clear</button> <br/> {grid} </div> )
}


const root = createRoot(document.getElementById('root'));
root.render(
<>
    <App />
</>		
);
</script>
